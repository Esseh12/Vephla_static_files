<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamflow-Dashboard</title>
    <!--------main stylesheets ------->
    <link rel="stylesheet" href="sidebar.css">
    <!-------- media Q------>
    <link rel="stylesheet" href="media quarry/searchbar-media.css">
    <link rel="stylesheet" href="media quarry/dashboard.css">

    <!-----Boxicon css ---------->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

    <nav class="sidebar close">
        <header>
            <div class="logo">
                <div class="img"> <img src="images/logo.svg" alt=""></div>
                <div class="title">
                    <span class="to-close">Teamflow</span>
                </div>
            </div>
            <i class='bx bx-chevron-right toggle'></i>
            <div class="input-field">
                <i class='bx bx-search searchBtn'></i>
                <input class="to-close" type="search" placeholder="Search...">
            </div>

            <div class="menu">
                <p>Main</p>

                <a href="#"><i class='bx bxs-dashboard'></i> <span class="to-close"> Dashboard</span></a>

                <a href="#"><i class='bx bx-line-chart'></i> <span class="to-close"> Key Metrics</span></a>

                <a href="#"><i class='bx bx-group'></i> <span class="to-close">Team</a></span>

                <a href="#"><i class='bx bx-message-dots'></i><span class="to-close"> Messages</span></a>

                <a href="#"><i class='bx bx-bell'></i></i> <span class="to-close"> Notifications</span></a>

                <a href="#"><i class='bx bx-detail'></i><span class="to-close"> Activities</span></a>

                <a href="#"><i class='bx bx-money-withdraw'></i><span class="to-close">Payrol</span></a>

                <a href="#"><i class='bx bxs-report'></i> <span class="to-close"> Reporting</span></a>

                <a href="#"><i class='bx bx-link'></i></i> <span class="to-close"> Intergration</span></a>



                <div class="bottom-side-bar">
                    <a href="#"><i class='bx bx-cog'></i> <span class="to-close"> Settings</span></a>
                    <a href="#"><i class='bx bx-support'></i></i><span class="to-close"> Support</span></a>
                    <a href="#"><i class='bx bx-log-out'></i></i><span class="to-close"> Logout</span></a>

                    <div class="mood">
                        <div class="moon-sun">
                            <i class='bx bxs-moon moon'></i>
                            <i class='bx bxs-sun sun'></i>
                        </div>
                        <span class="mode-text to-close">Dark Mode</span>
                        <div class="toggle-switch">
                            <span class="switch"></span>
                        </div>
                    </div>
                    <div class="profile">
                        <div class="profile-img">
                            <img src="images/profile-img.svg" alt="">
                        </div>
                        <div class="profile-details">
                            <h5 class="to-close">John Doe</h5>
                            <a href="#" class="to-close">johndoe@teamflow.com</a>
                        </div>
                    </div>
                </div>
        </header>
    </nav>


    <!-----------THE END OF SIDE BAR--------->

    <!-----LETS BEGIN THE HOME DASHBOARD---->
    <div class="home">
        <bo class="home-wrapper">

            <!---------DONT MESS WITH THE TWO DIVS ABOVE-->
            <div class="search-bar">
                <div class="search">
                    <div class="input">
                        <i class='bx bx-search'></i>
                        <input type="search" placeholder="Search here">
                    </div>
                    <div class="filters">
                        <span>Show only:</span>
                        <button>People</button>
                        <button>Events</button>
                        <button>Documents</button>
                        <button>Job openings</button>
                    </div>
                </div>
                <div class="calender">
                    <div class="icon">
                        <i class='bx bx-message-dots'></i>
                        <i class='bx bx-bell'></i>
                    </div>
                    <div class="date">
                        <input type="date" name="date" id="date">
                    </div>
                </div>
            </div>

            <!---------END OF TOP SEARCH BAR------------>


            <!---------BEGINNNING OF THE MAIN DASHBOARD------------>



            <div class="dashboard-container"> <!----dont delete this, build inside of it, it has a red background 
    color-->

                <div id="cssportal-grid">
                    <div id="div1">div1</div>
                    <div id="div2">div2</div>
                    <div id="div3">div3</div>
                    <div id="div4">div4</div>
                    <!-----this containers are just an example, u can delete and write ur own-->
                </div>



            </div>
            <script src="./sidebar.js"></script>
</body>
